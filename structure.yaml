src:
  structure.yaml:
    content: |-
      銀行取引履歴AI分析ツール - 個人の家計管理支援シングルページアプリケーション
      
      **プロジェクト概要:**
      個人の銀行取引履歴をCSVファイルまたはスクリーンショット画像で読み込み、
      LLMによる自動分析を行い、支出パターンや分類をグラフで可視化するWebアプリケーション。
      React TypeScriptベースのシングルページアプリケーションとして実装。
      
      **主要機能:**
      1. ファイル入力機能（CSV・画像対応）
      2. 画像OCR処理による取引データ抽出
      3. LLMによる取引データ分析・カテゴリ分類
      4. インタラクティブなグラフ・チャート可視化
      5. 支出サマリーと分析結果の表示
      6. レスポンシブデザイン
      
      **技術スタック:**
      - フロントエンド: React 18 + TypeScript + Vite
      - スタイリング: Tailwind CSS + shadcn/ui
      - グラフライブラリ: Recharts
      - ファイル処理: react-dropzone
      - 状態管理: React Hooks (useState, useEffect)
      - API通信: fetch API
      
      **データフロー:**
      入力（CSV/画像） → OCR処理 → LLM分析 → データ構造化 → グラフ描画 → 結果表示
      
      ref: "3次元リサージュ曲線によるカメラワークシミュレータ Ver.2 - vz7a-kwkm: 単一tsxファイルでの複雑なReactアプリケーション実装の参考として"
    agent選定理由: gemini-2.0-flash-thinking-exp-1219は思考実験に特化した高速な推論と軽量な処理が得意で、プロジェクト全体の構造設計に最適です。
    dependency: []
    agent: "gemini-2.0-flash-thinking-exp-1219"
    api: []
    
